[workspace]
resolver = "3"
members = ["crates/rok-tools", "crates/rok-tools-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ateeq1999/rok-tools"
homepage = "https://github.com/ateeq1999/rok-tools"
rust-version = "1.94"
authors = ["The rok-tools Contributors"]

[workspace.dependencies]
rok-tools = { path = "crates/rok-tools", version = "0.1.0", default-features = false }
rok-tools-cli = { path = "crates/rok-tools-cli", version = "0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
strip = "debuginfo"
